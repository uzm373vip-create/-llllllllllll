
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OU7 BANK - Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="register-page">
        <div class="brand">OU7<span>BANK</span></div>

        <div class="register-card">
            <div class="step">02 / 04</div>
            <h1>Demo kartangiz</h1>
            <p class="muted">Namuna karta ma'lumotlarini kiriting.</p>

            <div class="bank-card">
                <div class="card-head">
                    <b>OU7 BANK</b>
                    <span>DEMO</span>
                </div>
                <div class="chip">▦</div>
                <h2>0000 0000 0000 0000</h2>
                <div class="card-bottom">
                    <span>DEMO USER</span>
                    <span>MM/YY</span>
                </div>
            </div>

            <form action="3saxifa.salom.html">
                <label>Demo karta raqami</label>
                <input type="text" placeholder="0000 0000 0000 0000"
                       pattern="0000 0000 0000 0000"
                       required>

                <label>Karta muddati</label>
                <input type="text" placeholder="MM/YY"
                       pattern="MM/YY" required>

                <button type="submit"><a href="salom.html">Tasdiqlash →</a></button>
            </form>

            <p class="demo-note">Haqiqiy karta ma'lumotlarini kiritmang.</p>
        </div>
    </div>

</body>
</html>
